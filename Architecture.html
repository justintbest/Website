<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SLEEK — Architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        oklch(0.155 0.006 265);
    --bg-2:      oklch(0.195 0.007 265);
    --bg-3:      oklch(0.235 0.008 265);
    --line:      oklch(0.32 0.008 265 / 0.6);
    --line-soft: oklch(0.32 0.008 265 / 0.28);
    --fg:        oklch(0.955 0.004 265);
    --fg-2:      oklch(0.70 0.007 265);
    --fg-3:      oklch(0.55 0.008 265);
    --accent:    oklch(0.76 0.12 62);
    --accent-dim:oklch(0.76 0.12 62 / 0.18);
    --sans: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'Space Mono', ui-monospace, monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    overflow-x: hidden;
  }

  ::selection { background: var(--accent-dim); color: var(--fg); }

  .wrap { width: 100%; max-width: none; margin: 0; padding: 0 10px; }

  .mono-label {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg-3);
  }

  /* ---------- NAV ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 50;
    background: transparent;
    border-bottom: 1px solid transparent;
    transition: background 0.4s ease, border-color 0.4s ease, backdrop-filter 0.4s ease;
  }
  header.scrolled {
    backdrop-filter: blur(14px);
    background: oklch(0.155 0.006 265 / 0.82);
    border-bottom: 1px solid var(--line-soft);
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: relative;
    height: 68px;
    padding: 0 clamp(8px, 1.6vw, 26px);
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 3px;
    text-decoration: none;
    color: var(--fg);
  }
  .brand .mark {
    display: flex;
    align-items: baseline;
    gap: 10px;
    font-weight: 700;
    font-size: 24px;
    letter-spacing: 0.32em;
  }
  .brand .dot { width: 7px; height: 7px; background: var(--accent); display: inline-block; transform: translateY(-2px); }
  .brand .byline {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--fg);
  }
  .nav-links {
    display: flex; gap: 36px; align-items: center;
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  }
  .nav-links > a {
    font-family: var(--sans);
    font-size: 15px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
    transition: color 0.25s;
  }
  .nav-links > a:hover { color: var(--fg); }
  .nav-social { display: flex; align-items: center; gap: 16px; padding-left: 6px; margin-left: auto; }
  .social-ico {
    display: inline-flex;
    align-items: center;
    color: var(--fg);
    transition: color 0.25s, transform 0.25s;
  }
  .social-ico svg { display: block; }
  .social-ico:hover { color: var(--accent); transform: translateY(-2px); }

  /* ---------- FULL-BLEED HERO SLIDESHOW ---------- */
  .hero-show {
    position: relative;
    width: 100%;
    height: clamp(440px, 72vh, 780px);
    margin-top: -68px;            /* slide up behind the sticky nav */
    overflow: hidden;
    background: var(--bg-2);
  }
  .hero-show .slide {
    position: absolute;
    inset: 0;
    opacity: 0;
    transition: opacity 1.4s ease;
  }
  .hero-show .slide.is-active { opacity: 1; }
  .hero-show .slide .hph {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transform: scale(1);
  }
  .hero-show .slide.is-active .hph { animation: heroZoom 7s ease-out forwards; }
  .hero-show .slide .ph {
    position: absolute;
    inset: 0;
    background-color: var(--bg-2);
    background-image: repeating-linear-gradient(135deg, oklch(0.24 0.008 265) 0 2px, transparent 2px 13px);
    display: flex;
    align-items: center;
    justify-content: center;
    transform: scale(1);
  }
  .hero-show .slide.is-active .ph {
    animation: heroZoom 7s ease-out forwards;
  }
  .hero-show .slide.is-active .hph { animation: heroZoom 7s ease-out forwards; }
  @keyframes heroZoom { from { transform: scale(1.06); } to { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) {
    .hero-show .slide.is-active .ph,
    .hero-show .slide.is-active .hph { animation: none; }
  }
  .hero-show .slide .ph span {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--fg-3); border: 1px dashed var(--line); padding: 8px 14px;
    background: oklch(0.155 0.006 265 / 0.55);
  }
  /* gradient so the nav text stays legible over bright images, plus a fade into the page */
  /* zero image overlay — nav legibility handled by text-shadow instead */
  .hero-show .hero-dots {
    position: absolute; left: 0; right: 0; bottom: 22px;
    display: flex; justify-content: center; gap: 10px; z-index: 3;
  }
  .hero-show .hero-dots button {
    width: 32px; height: 3px; border: none; padding: 0; cursor: pointer;
    background: oklch(0.95 0.004 265 / 0.5);
    box-shadow: 0 1px 6px oklch(0.1 0.006 265 / 0.5);
    transition: background 0.3s;
  }
  .hero-show .hero-dots button.is-active { background: var(--accent); }
  /* nav sits directly on the artwork — no box, no overlay */
  /* soft dark gradient along the top so nav text stays readable (only over the hero) */
  .hero-show::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 170px;
    z-index: 2;
    pointer-events: none;
    background: linear-gradient(to bottom,
      oklch(0.14 0.006 265 / 0.55) 0%,
      oklch(0.14 0.006 265 / 0.30) 45%,
      transparent 100%);
  }
  .nav-cta {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
    border: 1px solid var(--line);
    padding: 9px 18px;
    transition: border-color 0.25s, color 0.25s;
  }
  .nav-cta:hover { border-color: var(--accent); color: var(--accent); }

  /* ---------- HERO ---------- */
  .hero { padding-top: clamp(28px, 4vw, 48px); padding-bottom: clamp(20px, 3vw, 32px); position: relative; }
  .hero-meta {
    display: flex;
    gap: 28px;
    flex-wrap: wrap;
    margin-bottom: 24px;
  }
  .hero h1 {
    font-size: clamp(48px, 11vw, 168px);
    font-weight: 400;
    line-height: 0.92;
    letter-spacing: -0.03em;
    margin-bottom: 28px;
  }
  .hero h1 em {
    font-style: normal;
    color: var(--fg-3);
  }
  .hero-sub {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 40px;
    flex-wrap: wrap;
  }
  .hero-sub p {
    max-width: 46ch;
    color: var(--fg-2);
    font-size: clamp(15px, 1.4vw, 18px);
    text-wrap: pretty;
  }
  .hero-stats { display: flex; gap: 48px; }
  .stat .n { font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  .stat .l { margin-top: 4px; }

  /* ---------- GALLERY ---------- */
  .gallery-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px;
    margin: 0 0 28px;
    border-bottom: 1px solid var(--line-soft);
    padding-bottom: 18px;
    flex-wrap: wrap;
  }
  .gallery-head h2 { font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filter {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--fg-2);
    background: none;
    border: 1px solid var(--line-soft);
    padding: 7px 14px;
    cursor: pointer;
    transition: all 0.22s;
  }
  .filter:hover { color: var(--fg); border-color: var(--line); }
  .filter.active { color: var(--bg); background: var(--fg); border-color: var(--fg); }

  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    background: transparent;
    padding-bottom: 5px;
    min-height: 80vh;
  }

  .card {
    position: relative;
    overflow: hidden;
    cursor: pointer;
    background: var(--bg-2);
    border: none;
    grid-column: span 1;
    aspect-ratio: 16 / 9;
    transition: transform 0.45s cubic-bezier(.2,.7,.2,1), border-color 0.3s;
  }
  /* uniform grid — all cards equal size */
  .card.wide, .card.tall, .card.feature { grid-column: span 1; aspect-ratio: 16 / 9; }

  .card:hover { z-index: 2; box-shadow: inset 0 0 0 1px var(--accent); }
  .card .cimg {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
  }
  .card:hover .cimg { transform: scale(1.05); }
  .card .ph {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(135deg,
        oklch(0.24 0.008 265) 0 2px,
        transparent 2px 11px);
    background-color: var(--bg-2);
    transition: transform 0.6s cubic-bezier(.2,.7,.2,1);
    display: flex; align-items: center; justify-content: center;
  }
  .card:hover .ph { transform: scale(1.05); }
  .card .ph span {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--fg-3);
    border: 1px dashed var(--line);
    padding: 6px 12px;
    background: oklch(0.155 0.006 265 / 0.55);
    backdrop-filter: blur(2px);
  }
  .card .scrim {
    position: absolute; inset: 0;
    background: linear-gradient(to top, oklch(0.10 0.006 265 / 0.92) 0%, transparent 55%);
    opacity: 0;
    transition: opacity 0.35s;
  }
  .card:hover .scrim { opacity: 1; }
  .card .info {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    padding: 18px 20px;
    transform: translateY(8px);
    opacity: 0;
    transition: transform 0.4s cubic-bezier(.2,.7,.2,1), opacity 0.35s;
  }
  .card:hover .info { transform: translateY(0); opacity: 1; }
  .card .info .t { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .card .info .m {
    margin-top: 5px;
    display: flex; gap: 14px;
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--fg-2);
  }
  .card .idx {
    position: absolute; top: 14px; left: 16px;
    font-family: var(--mono); font-size: 11px;
    letter-spacing: 0.1em; color: var(--fg-3);
    opacity: 0.7;
  }

  /* ---------- FOOTER ---------- */
  footer { border-top: 1px solid var(--line-soft); margin-top: 40px; padding: 48px 0 40px; }
  .foot {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    gap: 18px;
  }
  .foot-socials { display: flex; align-items: center; gap: 16px; }
  .foot-socials .social-ico {
    width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--bg-2); border: 1px solid var(--line);
  }
  .foot-label { font-size: 11px; letter-spacing: 0.18em; color: var(--fg-3); }
  .foot-email { font-size: 16px; font-weight: 600; color: var(--fg); text-decoration: none; }
  .foot-email:hover { color: var(--accent); }
  .foot-copy { font-size: 11px; color: var(--fg-3); margin-top: 8px; }
  .foot h3 { font-size: clamp(28px, 5vw, 56px); font-weight: 400; letter-spacing: -0.02em; line-height: 1; }
  .foot h3 a { color: var(--accent); text-decoration: none; }
  .foot-meta { text-align: right; display: flex; flex-direction: column; gap: 8px; }

  /* ---------- LIGHTBOX ---------- */
  .lb {
    position: fixed; inset: 0; z-index: 100;
    background: oklch(0.10 0.006 265 / 0.96);
    backdrop-filter: blur(8px);
    display: none;
    overflow-y: auto;
    padding: clamp(20px, 5vw, 72px);
    padding-top: clamp(60px, 8vw, 100px);
  }
  .lb.open { display: block; }
  .lb-inner { width: min(1100px, 100%); margin: 0 auto; padding-bottom: 80px; }
  .lb-stage {
    position: relative;
    background-color: var(--bg-2);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    min-height: 60px;
  }
  .lb-stage span {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--fg-3);
    border: 1px dashed var(--line); padding: 8px 16px;
  }
  .lb-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; gap: 24px; }
  .lb-bar .t { font-size: 24px; font-weight: 600; letter-spacing: -0.01em; }
  .lb-bar .m { margin-top: 8px; display: flex; gap: 18px; }
  .lb-nav { display: flex; gap: 10px; }
  .lb-btn {
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.1em;
    color: var(--fg); background: none; border: 1px solid var(--line);
    width: 44px; height: 44px; cursor: pointer; transition: all 0.2s;
  }
  .lb-btn:hover { border-color: var(--accent); color: var(--accent); }
  .lb-close {
    position: absolute; top: clamp(18px,4vw,34px); right: clamp(18px,4vw,34px);
    font-family: var(--mono); font-size: 12px; letter-spacing: 0.14em;
    color: var(--fg-2); background: none; border: 1px solid var(--line);
    padding: 10px 16px; cursor: pointer; transition: all 0.2s;
  }
  .lb-close:hover { color: var(--fg); border-color: var(--accent); }
  .lb-series { margin-top: 8px; display: flex; flex-direction: column; gap: 8px; }
  .lb-series-img {
    width: 100%;
    background: var(--bg-2); border: 1px solid var(--line); overflow: hidden;
  }
  .lb-series-img img { width: 100%; height: auto; display: block; }
  .lb-desc {
    display: none; margin: 18px 0; padding-top: 18px; border-top: 1px solid var(--line);
    max-width: 720px; font-size: 14px; line-height: 1.7; color: var(--fg-2);
  }
  .lb-desc.show { display: block; }
  .lb-desc p { margin: 0 0 14px; }
  .lb-desc .lb-desc-credit { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; color: var(--fg-3); text-transform: uppercase; }
  .lb-series.flow { display: block; column-count: 2; column-gap: 8px; }
  .lb-series.flow .lb-series-img { width: 100%; margin-bottom: 8px; break-inside: avoid; }
  .lb-series.flow .lb-series-img.wide { column-span: all; }
  .lb-series.flow .lb-series-row {
    column-span: all; display: flex; gap: 8px; margin-bottom: 8px;
  }
  .lb-series.flow .lb-series-row .lb-series-img { flex: 1; margin-bottom: 0; }
  @media (max-width: 880px) {
    .lb-series.flow .lb-series-row { flex-direction: column; }
  }
  .lb-series.flow .lb-series-img img { width: 100%; height: auto; }
  @media (max-width: 880px) {
    .lb-series.flow { column-count: 1; }
  }

  @media (max-width: 880px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .card, .card.wide, .card.tall, .card.feature { grid-column: span 1; aspect-ratio: 16/9; }
    .nav-links { display: none; }
    .nav-social { display: none; }
    .hero-sub { flex-direction: column; align-items: flex-start; }
  }

  /* Burger — hidden on desktop */
  .burger {
    display: none;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 10px;
    margin-right: 4px;
  }
  .burger span {
    display: block;
    width: 22px;
    height: 2px;
    background: var(--fg);
    transition: transform 0.25s, opacity 0.25s;
  }
  .burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
  .burger.open span:nth-child(2) { opacity: 0; }
  .burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

  .mobile-menu {
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    position: fixed;
    inset: 0;
    background: oklch(0.155 0.006 265 / 0.98);
    backdrop-filter: blur(20px);
    z-index: 200;
  }
  .mobile-menu.open { display: flex; }
  .mobile-menu a {
    font-family: var(--mono);
    font-size: 22px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--fg);
    text-decoration: none;
    padding: 24px 0;
    transition: color 0.2s;
  }
  .mobile-menu a:hover { color: var(--accent); }

  @media (max-width: 540px) {
    /* Nav */
    .burger { display: flex; }
    .brand .byline { display: none; }
    .brand .mark { font-size: 18px; letter-spacing: 0.22em; }

    /* Hero */
    .hero-show { height: clamp(260px, 55vw, 420px); }

    /* Gallery — single column, info shows on tap only */
    .grid { grid-template-columns: 1fr; min-height: 0; }
    .card, .card.wide, .card.tall, .card.feature { aspect-ratio: 16/9; }
    .card.tapped .info { transform: translateY(0); opacity: 1; }
    .card.tapped .scrim { opacity: 1; }

    /* Filters */
    .gallery-head { flex-direction: column; align-items: flex-start; gap: 14px; }
    .filters { gap: 6px; }
    .filter { padding: 6px 11px; font-size: 10px; }

    /* Footer */
    .foot { flex-direction: column; align-items: flex-start; }
    .foot-meta { text-align: left; }

    /* Lightbox */
    .lb { padding: 16px; padding-top: 56px; }
    .lb-inner { width: 100%; }
    .lb-close { top: 12px; right: 12px; padding: 8px 12px; font-size: 11px; }
    .lb-bar .t { font-size: 18px; }
    .lb-bar { flex-direction: column; gap: 12px; }
    .lb-nav { align-self: flex-end; }
  }
</style>
</head>
<body>

<main>
  <!-- FULL-BLEED HERO SLIDESHOW — slides are built from HERO_SLIDES in gallery-data.js -->
  <section class="hero-show" id="hero" aria-label="Featured work slideshow">
    <div class="hero-slides" id="heroSlides"></div>
    <div class="hero-dots" id="heroDots"></div>
  </section>

  <!-- GALLERY -->
  <section class="wrap" id="work" style="padding-top: clamp(20px, 2.5vw, 32px);">
    <div class="gallery-head">

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <button class="lb-close" id="lbClose">Esc ✕</button>
  <div class="lb-inner">
    <div class="lb-bar">
      <div>
        <div class="t" id="lbTitle">Title</div>
        <div class="m">
          <span class="mono-label" id="lbProj">Project</span>
          <span class="mono-label" id="lbMed">Medium</span>
          <span class="mono-label" id="lbYear">Year</span>
        </div>
      </div>
      <div class="lb-nav">
        <button class="lb-btn" id="lbPrev">←</button>
        <button class="lb-btn" id="lbNext">→</button>
      </div>
    </div>
    <div class="lb-stage">
      <span id="lbPh">Drop image</span>
    </div>
    <div class="lb-desc" id="lbDesc"></div>
    <div class="lb-series" id="lbSeries"></div>
  </div>
</div>

<script src="architecture-data.js"></script>
<script>
  // Build the render model from the editable content file (gallery-data.js).
  const PIECES = (window.GALLERY || []).map(g => ({
    t: g.title, proj: g.project, med: g.category, year: g.year, cat: g.cat,
    img: g.thumb || g.full || '', full: g.full || g.thumb || '',
    series: g.series || [], imgPos: g.imgPos || 'center', desc: g.desc || ''
  }));

  const grid = document.getElementById('grid');
  let visible = [];

  function render(filter) {
    grid.innerHTML = '';
    visible = PIECES.filter(p => filter === 'all' || p.cat === filter);
    visible.forEach((p, i) => {
      const card = document.createElement('div');
      card.className = 'card' + (p.size ? ' ' + p.size : '');
      card.innerHTML = `
        ${p.img ? `<img class="cimg" src="${p.img}" alt="${p.t}" loading="lazy" style="object-position:${p.imgPos}">` : `<div class="ph"><span>${p.med} — drop image</span></div>`}
        <div class="scrim"></div>
        <div class="info">
          <div class="t">${p.t}</div>
          <div class="m"><span>${p.proj}</span><span>${p.year}</span></div>
        </div>`;
      card.addEventListener('click', (e) => {
        if (window.innerWidth <= 540 && !card.classList.contains('tapped')) return;
        openLb(i);
      });
      grid.appendChild(card);
    });
  }

  document.querySelectorAll('.filter').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render(btn.dataset.f);
    });
  });

  // Lightbox
  const lb = document.getElementById('lb');
  let cur = 0;
  function openLb(i) {
    cur = i; fillLb(); lb.classList.add('open'); lb.scrollTop = 0; document.body.style.overflow = 'hidden';
  }
  function fillLb() {
    const p = visible[cur];
    document.getElementById('lbTitle').textContent = p.t;
    document.getElementById('lbProj').textContent = p.proj;
    document.getElementById('lbMed').textContent = p.med;
    document.getElementById('lbYear').textContent = p.year;
    const stage = document.querySelector('.lb-stage');
    const ph = document.getElementById('lbPh');
    let lbImg = document.getElementById('lbImg');
    const src = p.full || p.img;
    if (src) {
      if (!lbImg) {
        lbImg = document.createElement('img');
        lbImg.id = 'lbImg';
        lbImg.style.cssText = 'width:100%;height:auto;display:block;';
        stage.appendChild(lbImg);
      }
      lbImg.src = src;
      lbImg.style.display = '';
      ph.style.display = 'none';
    } else {
      if (lbImg) lbImg.style.display = 'none';
      ph.style.display = '';
      ph.textContent = p.med + ' — drop image';
    }
    // Rebuild vertical series stack
    const series = document.getElementById('lbSeries');
    // Description block
    const desc = document.getElementById('lbDesc');
    if (p.desc) {
      desc.innerHTML = p.desc;
      desc.classList.add('show');
    } else {
      desc.innerHTML = '';
      desc.classList.remove('show');
    }

    series.innerHTML = '';
    series.classList.toggle('flow', p.t === 'Rethinking Monolithic Architecture' || p.t === 'Cooperative Housing');
    if (p.series && p.series.length) {
      let rowEl = null;
      p.series.forEach(s => {
        const wrap = document.createElement('div');
        wrap.className = 'lb-series-img' + (s.wide ? ' wide' : '');
        if (s.full || s.thumb) wrap.innerHTML = `<img src="${s.full || s.thumb}" alt="" loading="lazy">`;
        if (s.row) {
          if (!rowEl || rowEl.dataset.row !== s.row) {
            rowEl = document.createElement('div');
            rowEl.className = 'lb-series-row';
            rowEl.dataset.row = s.row;
            series.appendChild(rowEl);
          }
          rowEl.appendChild(wrap);
        } else {
          rowEl = null;
          series.appendChild(wrap);
        }
      });
    }
  }
  function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
  function nav(d) { cur = (cur + d + visible.length) % visible.length; fillLb(); }

  document.getElementById('lbClose').addEventListener('click', closeLb);
  document.getElementById('lbPrev').addEventListener('click', () => nav(-1));
  document.getElementById('lbNext').addEventListener('click', () => nav(1));
  lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
  document.addEventListener('keydown', e => {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') closeLb();
    if (e.key === 'ArrowLeft') nav(-1);
    if (e.key === 'ArrowRight') nav(1);
  });

  render('all');

  /* ---- Burger menu ---- */
  const burger = document.getElementById('burger');
  const mobileMenu = document.getElementById('mobileMenu');
  burger.addEventListener('click', () => {
    burger.classList.toggle('open');
    mobileMenu.classList.toggle('open');
  });
  document.getElementById('mobileWork').addEventListener('click', () => {
    burger.classList.remove('open');
    mobileMenu.classList.remove('open');
  });

  /* ---- Mobile tap-to-reveal card titles ---- */
  grid.addEventListener('click', e => {
    if (window.innerWidth > 540) return;
    const card = e.target.closest('.card');
    if (!card) return;
    const already = card.classList.contains('tapped');
    grid.querySelectorAll('.card.tapped').forEach(c => c.classList.remove('tapped'));
    if (!already) { card.classList.add('tapped'); e.stopPropagation(); return; }
  });

  /* ---- Hero slideshow (built from HERO_SLIDES in gallery-data.js) ---- */
  (function () {
    const wrap = document.getElementById('heroSlides');
    const dotsWrap = document.getElementById('heroDots');
    const sources = window.HERO_SLIDES || [];

    // Build slides — an entry can be an image path OR a placeholder label.
    if (sources.length) {
      sources.forEach((entry, i) => {
        const src = typeof entry === 'object' ? entry.src : entry;
        const pos = typeof entry === 'object' && entry.imgPos ? entry.imgPos : 'center';
        const slide = document.createElement('div');
        slide.className = 'slide' + (i === 0 ? ' is-active' : '');
        const isImage = /\.(jpe?g|png|webp|gif|avif)$/i.test(src) || src.includes('/');
        slide.innerHTML = isImage
          ? `<img class="hph" src="${src}" alt="" style="object-position:${pos}"${i > 0 ? ' loading="lazy"' : ''}>`
          : `<div class="ph"><span>${src}</span></div>`;
        wrap.appendChild(slide);
      });
    } else {
      // No images yet — show a single placeholder so the band isn't blank.
      const slide = document.createElement('div');
      slide.className = 'slide is-active';
      slide.innerHTML = `<div class="ph"><span>Hero — add images in gallery-data.js</span></div>`;
      wrap.appendChild(slide);
    }

    const slides = [...wrap.querySelectorAll('.slide')];
    if (slides.length < 2) { dotsWrap.style.display = 'none'; return; }  // nothing to cycle

    let idx = 0, timer;
    const INTERVAL = 6000;

    slides.forEach((_, i) => {
      const b = document.createElement('button');
      b.setAttribute('aria-label', 'Show slide ' + (i + 1));
      if (i === 0) b.classList.add('is-active');
      b.addEventListener('click', () => go(i, true));
      dotsWrap.appendChild(b);
    });
    const dots = [...dotsWrap.children];

    function go(n, manual) {
      slides[idx].classList.remove('is-active');
      dots[idx].classList.remove('is-active');
      idx = (n + slides.length) % slides.length;
      // retrigger the ken-burns zoom
      const media = slides[idx].querySelector('.hph, .ph');
      if (media) { media.style.animation = 'none'; void media.offsetWidth; media.style.animation = ''; }
      slides[idx].classList.add('is-active');
      dots[idx].classList.add('is-active');
      if (manual) restart();
    }
    function next() { go(idx + 1); }
    function restart() { clearInterval(timer); timer = setInterval(next, INTERVAL); }
    restart();
  })();

  /* ---- Transparent nav over hero, solid once scrolled past it ---- */
  (function () {
    const header = document.querySelector('header');
    const hero = document.getElementById('hero');
    if (!header || !hero) return;
    function onScroll() {
      const trigger = hero.offsetHeight - 90;
      header.classList.toggle('scrolled', window.scrollY > trigger);
    }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', onScroll);
  })();
</script>
